<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXT AI - Chat Website Creator</title>
    <!-- Firebase SDKs (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --sidebar-bg: #1e293b;
            --chat-bg: #0b0f19;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Tela de Autenticação */
        .auth-overlay {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.95);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background-color: var(--sidebar-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .auth-card h2 { margin-bottom: 8px; font-size: 1.5rem; }
        .auth-card p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
        .auth-input {
            width: 100%; padding: 12px 16px; background-color: var(--bg-color);
            border: 1px solid var(--border); border-radius: 10px; color: var(--text-main);
            font-size: 0.95rem; outline: none; margin-bottom: 12px;
        }
        .auth-input:focus { border-color: var(--primary); }

        /* Layout Principal com Sidebar (Estilo Gemini) */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
        }

        .btn-new-chat {
            background-color: var(--primary);
            color: white; border: none; padding: 12px; border-radius: 10px;
            font-weight: 600; cursor: pointer; text-align: left;
            display: flex; align-items: center; gap: 8px; transition: background 0.2s;
        }
        .btn-new-chat:hover { background-color: var(--primary-hover); }

        .chat-history-list {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
        }

        .history-item {
            padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
            color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: background 0.2s, color 0.2s;
        }
        .history-item:hover, .history-item.active {
            background-color: rgba(255, 255, 155, 0.05); color: var(--text-main);
        }

        .sidebar-footer {
            border-top: 1px solid var(--border);
            padding-top: 10px; display: flex; flex-direction: column; gap: 8px;
        }

        .main-content {
            flex: 1; display: flex; flex-direction: column; background-color: var(--bg-color);
            height: 100vh; position: relative;
        }

        .top-header {
            padding: 15px 25px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--sidebar-bg);
        }

        .access-code-bar {
            display: flex; gap: 8px; align-items: center;
        }
        .access-code-bar input {
            padding: 6px 10px; background: var(--bg-color); border: 1px solid var(--border);
            border-radius: 6px; color: white; font-size: 0.85rem; outline: none; width: 140px;
        }

        /* Área do Chat Principal */
        .chat-container {
            flex: 1; overflow-y: auto; padding: 25px; display: flex;
            flex-direction: column; gap: 20px; max-width: 900px; width: 100%; margin: 0 auto;
        }

        .message {
            max-width: 85%; padding: 15px 20px; border-radius: 14px; font-size: 0.95rem; line-height: 1.5; word-break: break-word;
        }
        .message.user { background-color: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 3px; }
        .message.ai { background-color: var(--sidebar-bg); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 3px; border: 1px solid var(--border); }

        .code-snippet {
            background: var(--chat-bg); border: 1px solid var(--border); padding: 12px;
            border-radius: 8px; font-family: monospace; font-size: 0.82rem; color: #38bdf8;
            max-height: 180px; overflow-y: auto; margin-top: 12px; text-align: left; white-space: pre-wrap;
        }

        .chat-actions { display: flex; gap: 10px; margin-top: 12px; }
        .chat-btn {
            background: var(--primary); color: white; border: none; padding: 8px 14px;
            border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block;
        }
        .chat-btn:hover { background: var(--primary-hover); }
        .chat-btn-success { background: var(--success); }
        .chat-btn-success:hover { background: #16a34a; }

        /* Input Inferior */
        .input-area {
            padding: 20px 25px; background-color: var(--sidebar-bg); border-top: 1px solid var(--border);
            display: flex; justify-content: center;
        }
        .input-wrapper {
            max-width: 800px; width: 100%; display: flex; gap: 10px;
            background: var(--bg-color); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px;
        }
        textarea {
            flex: 1; background: transparent; border: none; color: var(--text-main);
            font-size: 0.95rem; outline: none; resize: none; height: 24px; max-height: 120px; padding: 4px;
        }
        button.send-btn {
            background-color: var(--primary); color: white; border: none; border-radius: 8px;
            padding: 0 16px; font-weight: 600; cursor: pointer; height: 36px; transition: background 0.2s;
        }
        button.send-btn:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>

    <!-- Tela de Autenticação -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card">
            <h2>OXT AI Login</h2>
            <p>Enter your username and password to access your chats and saved websites:</p>
            <input type="text" class="auth-input" id="usernameInput" placeholder="Username">
            <input type="password" class="auth-input" id="passwordInput" placeholder="Password">
            <button onclick="autenticarUsuario()" style="width: 100%; padding: 12px; border-radius: 10px; background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer;">Continue</button>
        </div>
    </div>

    <!-- Sidebar com Histórico e Botão Nova Conversa (Estilo Gemini) -->
    <div class="sidebar">
        <button class="btn-new-chat" onclick="criarNovaConversa()">➕ New Chat</button>
        <div class="chat-history-list" id="chatHistoryList">
            <!-- Os chats salvos aparecem aqui -->
        </div>
        <div class="sidebar-footer">
            <div style="font-size: 0.8rem; color: var(--text-muted);">User: <strong id="displayUser" style="color: white;"></strong></div>
            <button onclick="fazerLogout()" style="background: rgba(239, 68, 68, 0.15); border: 1px solid var(--error); color: var(--error); padding: 6px; border-radius: 6px; font-size: 0.75rem; cursor: pointer;">Logout</button>
        </div>
    </div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
        <div class="top-header">
            <h1 style="font-size: 1.2rem;">OXT AI Website Builder</h1>
            <div class="access-code-bar">
                <input type="text" id="accessCodeInput" placeholder="Enter Project ID...">
                <button class="chat-btn" onclick="carregarSitePorCodigo()" style="padding: 6px 12px; font-size: 0.8rem;">Open Code</button>
            </div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
            <div class="message ai">
                Hello! I am OXT AI. Tell me what website you want to build (e.g. "Create a white background with a button" or customize it however you like).
            </div>
        </div>

        <!-- Input de Mensagem -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="promptInput" placeholder="Ask OXT AI to build or modify a website..." rows="1" onkeydown="checarEnter(event)"></textarea>
                <button class="send-btn" onclick="enviarMensagem()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBJf2YuT_MTutaIQD1538aewftKj_hr_rQ",
            authDomain: "radio-43909.firebaseapp.com",
            databaseURL: "https://radio-43909-default-rtdb.firebaseio.com",
            projectId: "radio-43909",
            storageBucket: "radio-43909.firebasestorage.app",
            messagingSenderId: "52262135904",
            appId: "1:52262135904:web:169a7405b3fe0c76827b05",
            measurementId: "G-FDKRJ35EB5"
        };

        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        const GEMINI_API_KEY = "AQ.Ab8RN6Ki0P7LukRelWJptkvqZ5VaaxDIytSwG_k0_3FYE_TNwQ";
        let usuarioAtual = localStorage.getItem('oxt_username') || null;
        let chatIdAtual = localStorage.getItem('oxt_active_chat') || null;

        window.addEventListener('DOMContentLoaded', () => {
            if (usuarioAtual) {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('displayUser').innerText = usuarioAtual;
                inicializarApp();
            } else {
                document.getElementById('authOverlay').style.display = 'flex';
            }
        });

        async function autenticarUsuario() {
            let user = document.getElementById('usernameInput').value.trim().toLowerCase();
            let pass = document.getElementById('passwordInput').value.trim();

            if (!user || !pass) { alert("Enter username and password!"); return; }

            let userRef = rtdb.ref('users/' + user);
            userRef.once('value', async (snapshot) => {
                if (snapshot.exists()) {
                    if (snapshot.val().password === pass) {
                        salvarSessao(user);
                    } else {
                        alert("Incorrect password!");
                    }
                } else {
                    await userRef.set({ password: pass });
                    salvarSessao(user);
                }
            });
        }

        function salvarSessao(user) {
            localStorage.setItem('oxt_username', user);
            usuarioAtual = user;
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('displayUser').innerText = user;
            inicializarApp();
        }

        function fazerLogout() {
            localStorage.removeItem('oxt_username');
            localStorage.removeItem('oxt_active_chat');
            location.reload();
        }

        function inicializarApp() {
            carregarListaDeConversas();
        }

        // Gerenciamento de Conversas (Chats)
        function criarNovaConversa() {
            chatIdAtual = 'chat_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('oxt_active_chat', chatIdAtual);
            
            // Salva conversa vazia no Firebase
            rtdb.ref(`users_data/${usuarioAtual}/chats/${chatIdAtual}`).set({
                title: "New Chat",
                createdAt: new Date().toISOString()
            });

            document.getElementById('chatContainer').innerHTML = `
                <div class="message ai">New chat started! What website would you like me to build?</div>
            `;
            carregarListaDeConversas();
        }

        function carregarListaDeConversas() {
            rtdb.ref(`users_data/${usuarioAtual}/chats`).once('value', (snapshot) => {
                let listEl = document.getElementById('chatHistoryList');
                listEl.innerHTML = '';

                if (!snapshot.exists()) {
                    criarNovaConversa();
                    return;
                }

                let chats = snapshot.val();
                let keys = Object.keys(chats).reverse();

                if (!chatIdAtual || !chats[chatIdAtual]) {
                    chatIdAtual = keys[0];
                    localStorage.setItem('oxt_active_chat', chatIdAtual);
                }

                keys.forEach(id => {
                    let chatData = chats[id];
                    let div = document.createElement('div');
                    div.className = `history-item ${id === chatIdAtual ? 'active' : ''}`;
                    div.innerText = chatData.title || "Chat";
                    div.onclick = () => {
                        chatIdAtual = id;
                        localStorage.setItem('oxt_active_chat', chatIdAtual);
                        carregarMensagensDoChat(id);
                        carregarListaDeConversas();
                    };
                    listEl.appendChild(div);
                });

                carregarMensagensDoChat(chatIdAtual);
            });
        }

        function carregarMensagensDoChat(chatId) {
            let container = document.getElementById('chatContainer');
            container.innerHTML = '';

            rtdb.ref(`users_data/${usuarioAtual}/chats/${chatId}/messages`).once('value', (snapshot) => {
                if (!snapshot.exists()) {
                    container.innerHTML = `<div class="message ai">Hello! Tell me what website you want to create.</div>`;
                    return;
                }

                let msgs = snapshot.val();
                Object.keys(msgs).forEach(msgKey => {
                    let m = msgs[msgKey];
                    if (m.sender === 'user') {
                        adicionarMensagemDOM(m.text, 'user');
                    } else {
                        let msgId = adicionarMensagemDOM("", 'ai');
                        atualizarMensagemDOMAI(msgId, m.prompt, m.html, m.projectId);
                    }
                });
            });
        }

        function checarEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviarMensagem();
            }
        }

        async function enviarMensagem() {
            let prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) return;

            document.getElementById('promptInput').value = '';
            adicionarMensagemDOM(prompt, 'user');

            // Salva mensagem do usuário no Firebase
            rtdb.ref(`users_data/${usuarioAtual}/chats/${chatIdAtual}/messages`).push({
                sender: 'user', text: prompt, time: new Date().toISOString()
            });

            // Atualiza título do chat se for o primeiro prompt
            rtdb.ref(`users_data/${usuarioAtual}/chats/${chatIdAtual}/title`).set(prompt.slice(0, 25));
            carregarListaDeConversas();

            let loadingId = adicionarMensagemDOM("OXT AI is coding your website...", 'ai');

            try {
                // Gemini gerencia a criação customizável do site (fundo branco, botões, ou layouts avançados se pedido)
                let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            {
                                role: "user",
                                parts: [
                                    { text: "System rule: You are OXT AI, a flexible website creator engine. If user asks for simple things like 'create a button', make a clean white background with a centered button. If user asks for custom layouts, colors, or styles, follow their instructions precisely. Return ONLY valid clean HTML code without markdown blocks." },
                                    { text: `User website request: ${prompt}` }
                                ]
                            }
                        ]
                    })
                });

                let data = await response.json();
                let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                let htmlLimpo = rawText.replace(/```html/g, '').replace(/```/g, '').trim();

                if (!htmlLimpo || !htmlLimpo.includes('<!DOCTYPE html>')) {
                    htmlLimpo = criarHtmlPadrao(prompt);
                }

                // ID Único Fixado para este site específico
                let projectId = 'oxt_' + Math.random().toString(36).substr(2, 9);

                // Salva o projeto globalmente para poder abrir por código a qualquer momento
                await rtdb.ref(`projects/${projectId}`).set({
                    prompt: prompt, html: htmlLimpo, createdAt: new Date().toISOString()
                });

                // Salva a mensagem da IA no chat atual
                await rtdb.ref(`users_data/${usuarioAtual}/chats/${chatIdAtual}/messages`).push({
                    sender: 'ai', prompt: prompt, html: htmlLimpo, projectId: projectId, time: new Date().toISOString()
                });

                atualizarMensagemDOMAI(loadingId, prompt, htmlLimpo, projectId);

            } catch (err) {
                console.error(err);
                let htmlLimpo = criarHtmlPadrao(prompt);
                let projectId = 'oxt_' + Math.random().toString(36).substr(2, 9);

                await rtdb.ref(`projects/${projectId}`).set({
                    prompt: prompt, html: htmlLimpo, createdAt: new Date().toISOString()
                });

                await rtdb.ref(`users_data/${usuarioAtual}/chats/${chatIdAtual}/messages`).push({
                    sender: 'ai', prompt: prompt, html: htmlLimpo, projectId: projectId, time: new Date().toISOString()
                });

                atualizarMensagemDOMAI(loadingId, prompt, htmlLimpo, projectId);
            }
        }

        function adicionarMensagemDOM(texto, remetente) {
            let chat = document.getElementById('chatContainer');
            let div = document.createElement('div');
            let msgId = 'msg_' + Math.random().toString(36).substr(2, 9);
            div.id = msgId;
            div.className = `message ${remetente}`;
            div.innerText = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return msgId;
        }

        function atualizarMensagemDOMAI(msgId, prompt, html, projectId) {
            let msgEl = document.getElementById(msgId);
            if (!msgEl) return;

            let blob = new Blob([html], { type: 'text/html' });
            let blobUrl = URL.createObjectURL(blob);

            msgEl.innerHTML = `
                Website created for: <strong>${prompt}</strong><br>
                Project ID Code: <code style="color: #38bdf8; font-weight: bold;">${projectId}</code>
                <div class="code-snippet">${escapeHtml(html)}</div>
                <div class="chat-actions">
                    <a href="${blobUrl}" class="chat-btn chat-btn-success" target="_blank">Open Website</a>
                    <button class="chat-btn" onclick="copiarCodigoTexto(this, \`${btoa(encodeURIComponent(html))}\`)">Copy Code</button>
                </div>
            `;
            let chat = document.getElementById('chatContainer');
            chat.scrollTop = chat.scrollHeight;
        }

        function criarHtmlPadrao(prompt) {
            return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXT AI Website</title>
    <style>
        body { background: #ffffff; color: #111827; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        button { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <button onclick="alert('Button clicked!')">Click Me</button>
</body>
</html>`;
        }

        // Acessar site por código único fixado
        async function carregarSitePorCodigo() {
            let code = document.getElementById('accessCodeInput').value.trim();
            if (!code) { alert("Enter a project code ID!"); return; }

            rtdb.ref(`projects/${code}`).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    let data = snapshot.val();
                    let msgId = adicionarMensagemDOM("", 'ai');
                    atualizarMensagemDOMAI(msgId, data.prompt, data.html, code);
                } else {
                    alert("Project code not found.");
                }
            });
        }

        function copiarCodigoTexto(btn, encodedHtml) {
            let html = decodeURIComponent(atob(encodedHtml));
            navigator.clipboard.writeText(html).then(() => {
                let original = btn.innerText;
                btn.innerText = "Copied! ✓";
                setTimeout(() => { btn.innerText = original; }, 2000);
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
