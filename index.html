<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXT - Inspetor de HTML</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            color: var(--text-main);
            letter-spacing: 1px;
        }

        .version {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        input[type="url"] {
            width: 100%;
            padding: 14px 18px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="url"]:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Barra de Progresso e Status */
        .progress-box {
            display: none;
            margin-top: 15px;
            text-align: left;
        }

        .progress-container {
            width: 100%;
            background-color: var(--bg-color);
            border-radius: 10px;
            overflow: hidden;
            height: 20px;
            border: 1px solid var(--border);
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.15s ease;
        }

        .progress-text {
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            font-size: 0.75rem;
            line-height: 20px;
            color: white;
            font-weight: bold;
            text-align: center;
        }

        .status-details {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Log de Erro Detalhado */
        .error-box {
            display: none;
            margin-top: 20px;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            border-radius: 10px;
            padding: 15px;
            text-align: left;
        }

        .error-title {
            color: var(--error);
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .error-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: monospace;
            word-break: break-all;
        }

        /* Seção de Resultados */
        .result-section {
            display: none;
            margin-top: 25px;
            text-align: left;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lines-count {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn-copy {
            background-color: var(--success);
            flex: 1;
        }
        .btn-copy:hover {
            background-color: #16a34a;
        }

        .btn-view {
            background-color: #334155;
            flex: 1;
        }
        .btn-view:hover {
            background-color: #475569;
        }

        .code-viewer {
            display: none;
            margin-top: 15px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            white-space: pre-wrap;
            word-break: break-all;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>OXT</h1>
        <div class="version">Versão 1.0</div>

        <div class="input-group" id="inputSection">
            <input type="url" id="urlInput" placeholder="Digite o link do site (ex: https://exemplo.com)" required>
            <button id="startBtn" onclick="iniciarExtracao()">Começar Inspeção</button>
        </div>

        <!-- Caixa de Progresso e Status em tempo real -->
        <div class="progress-box" id="progressBox">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-text" id="progressText">0%</div>
            </div>
            <div class="status-details">
                <span id="statusMessage">Iniciando requisição...</span>
                <span id="timeLeft">Calculando tempo...</span>
            </div>
        </div>

        <!-- Log de Erro -->
        <div class="error-box" id="errorBox">
            <div class="error-title">⚠️ Falha na Inspeção</div>
            <div class="error-desc" id="errorDesc">Nenhum erro registrado.</div>
        </div>

        <!-- Seção de Resultados -->
        <div class="result-section" id="resultSection">
            <div class="lines-count" id="linesCountText">Linhas encontradas: 0</div>
            <div class="actions">
                <button class="btn-copy" onclick="copiarCodigo()">Copiar Código</button>
                <button class="btn-view" onclick="alternarVisualizacao()">Ver HTML Inteiro</button>
            </div>
            <div class="code-viewer" id="codeViewer"></div>
        </div>
    </div>

    <script>
        let codigoHtmlGlobal = "";

        function atualizarStatus(porcentagem, mensagem, tempoRestante) {
            document.getElementById('progressBar').style.width = porcentagem + '%';
            document.getElementById('progressText').innerText = porcentagem + '%';
            document.getElementById('statusMessage').innerText = mensagem;
            document.getElementById('timeLeft').innerText = tempoRestante;
        }

        function iniciarExtracao() {
            let url = document.getElementById('urlInput').value.trim();
            const errorBox = document.getElementById('errorBox');
            const resultSection = document.getElementById('resultSection');
            
            errorBox.style.display = 'none';
            resultSection.style.display = 'none';

            if (!url) {
                alert("Por favor, digite um link válido!");
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            // Esconde o botão e prepara a tela de progresso
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('urlInput').disabled = true;
            document.getElementById('progressBox').style.display = 'block';

            let tempoInicio = Date.now();
            let progresso = 10;

            atualizarStatus(progresso, "Conectando ao proxy seguro...", "Estimativa: ~3s");

            let intervalo = setInterval(() => {
                if (progresso < 85) {
                    progresso += 15;
                    
                    if (progresso === 25) {
                        atualizarStatus(progresso, "Enviando pacotes de requisição...", "Estimativa: ~2s");
                    } else if (progresso === 40) {
                        atualizarStatus(progresso, "Acessando servidores externos...", "Estimativa: ~2s");
                    } else if (progresso === 55) {
                        atualizarStatus(progresso, "Analisando e varrendo erros no HTML...", "Estimativa: ~1s");
                    } else if (progresso === 70) {
                        atualizarStatus(progresso, "Baixando o código fonte...", "Estimativa: ~1s");
                    } else if (progresso === 85) {
                        atualizarStatus(progresso, "Quase lá, estruturando dados...", "Estimativa: quase pronto");
                    }
                }
            }, 350);

            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;

            fetch(proxyUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Erro HTTP: ${response.status} - O servidor recusou a conexão.`);
                    }
                    return response.json();
                })
                .then(data => {
                    clearInterval(intervalo);

                    if (!data.contents) {
                        throw new Error("O servidor retornou um conteúdo vazio ou o site bloqueou o acesso.");
                    }

                    codigoHtmlGlobal = data.contents;
                    let totalLinhas = codigoHtmlGlobal.split('\n').length;

                    // Calcula o tempo total levado
                    let tempoGasto = ((Date.now() - tempoInicio) / 1000).toFixed(1);

                    atualizarStatus(100, "Concluído com sucesso!", `Tempo total: ${tempoGasto}s (${totalLinhas} linhas)`);

                    setTimeout(() => {
                        document.getElementById('progressBox').style.display = 'none';
                        mostrarResultados(totalLinhas);
                    }, 600);
                })
                .catch(err => {
                    clearInterval(intervalo);
                    document.getElementById('progressBox').style.display = 'none';
                    document.getElementById('startBtn').style.display = 'block';
                    document.getElementById('urlInput').disabled = false;
                    
                    // Exibe o Log de Erro detalhado
                    errorBox.style.display = 'block';
                    document.getElementById('errorDesc').innerText = err.message || "Erro desconhecido ao tentar capturar o link.";
                    console.error(err);
                });
        }

        function mostrarResultados(totalLinhas) {
            document.getElementById('linesCountText').innerText = `O código possui ${totalLinhas.toLocaleString('pt-BR')} linhas.`;
            document.getElementById('codeViewer').innerText = codigoHtmlGlobal;
            document.getElementById('resultSection').style.display = 'block';
        }

        function copiarCodigo() {
            navigator.clipboard.writeText(codigoHtmlGlobal).then(() => {
                const btnCopy = document.querySelector('.btn-copy');
                btnCopy.innerText = "Copiado! ✓";
                setTimeout(() => {
                    btnCopy.innerText = "Copiar Código";
                }, 2000);
            }).catch(err => {
                alert("Erro ao copiar o código.");
            });
        }

        function alternarVisualizacao() {
            const viewer = document.getElementById('codeViewer');
            const btnView = document.querySelector('.btn-view');

            if (viewer.style.display === 'block') {
                viewer.style.display = 'none';
                btnView.innerText = "Ver HTML Inteiro";
            } else {
                viewer.style.display = 'block';
                btnView.innerText = "Esconder HTML";
            }
        }
    </script>
</body>
</html>
