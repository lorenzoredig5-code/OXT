<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXT AI - Chat Website Creator</title>
    <!-- Firebase SDKs (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --error: #ef4444;
            --beta-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        /* Tela de Autenticação (Login / Cadastro com Nome e Senha) */
        .auth-overlay {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.95);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .auth-card h2 {
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 1.5rem;
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .auth-input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 12px;
        }

        .auth-input:focus {
            border-color: var(--primary);
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text-main);
        }

        .user-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* Área de Chat (Conversa estilo IA) */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }

        /* Mensagem do Usuário (Direita) */
        .message.user {
            background-color: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        /* Mensagem da OXT AI (Esquerda) */
        .message.ai {
            background-color: #334155;
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .code-snippet {
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #38bdf8;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 8px;
            text-align: left;
            white-space: pre-wrap;
        }

        .chat-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .chat-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .chat-btn:hover { background: var(--primary-hover); }

        .chat-btn-success { background: var(--success); }
        .chat-btn-success:hover { background: #16a34a; }

        /* Barra de Input de Envio */
        .input-chat-box {
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            padding: 12px 15px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            resize: none;
            height: 50px;
        }

        textarea:focus { border-color: var(--primary); }

        button.send-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.send-btn:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>

    <!-- Tela de Login / Cadastro Automático -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-card">
            <h2>OXT AI Account</h2>
            <p>Enter your username and password to log in or create your account automatically:</p>
            <input type="text" class="auth-input" id="usernameInput" placeholder="Username">
            <input type="password" class="auth-input" id="passwordInput" placeholder="Password">
            <button onclick="autenticarUsuario()" style="width: 100%; padding: 12px; border-radius: 10px; background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer;">Continue</button>
        </div>
    </div>

    <div class="container">
        <div class="header-area">
            <div class="logo-area">
                <h1>OXT AI</h1>
            </div>
            <div class="user-info">
                <span>User: <strong id="displayUser"></strong></span>
                <button class="btn-logout" onclick="fazerLogout()">Logout</button>
            </div>
        </div>

        <!-- Janela de Conversa (Chat Interface) -->
        <div class="chat-container" id="chatContainer">
            <div class="message ai">
                Hello! I am OXT AI. Tell me what website you want me to create, and I will code it instantly for you.
            </div>
        </div>

        <!-- Input de Mensagem -->
        <div class="input-chat-box">
            <textarea id="promptInput" placeholder="Type what website you want to create..." onkeydown="checarEnter(event)"></textarea>
            <button class="send-btn" onclick="enviarMensagem()">Send</button>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO FIREBASE REALTIME DATABASE
        const firebaseConfig = {
            apiKey: "AIzaSyBJf2YuT_MTutaIQD1538aewftKj_hr_rQ",
            authDomain: "radio-43909.firebaseapp.com",
            databaseURL: "https://radio-43909-default-rtdb.firebaseio.com",
            projectId: "radio-43909",
            storageBucket: "radio-43909.firebasestorage.app",
            messagingSenderId: "52262135904",
            appId: "1:52262135904:web:169a7405b3fe0c76827b05",
            measurementId: "G-FDKRJ35EB5"
        };

        firebase.initializeApp(firebaseConfig);
        const rtdb = firebase.database();

        const GEMINI_API_KEY = "AQ.Ab8RN6Ki0P7LukRelWJptkvqZ5VaaxDIytSwG_k0_3FYE_TNwQ";
        let usuarioAtual = localStorage.getItem('oxt_username') || null;

        // Gerenciamento de Autenticação Simples (Nome e Senha)
        window.addEventListener('DOMContentLoaded', () => {
            if (usuarioAtual) {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('displayUser').innerText = usuarioAtual;
                carregarHistoricoDoFirebase(usuarioAtual);
            } else {
                document.getElementById('authOverlay').style.display = 'flex';
            }
        });

        async function autenticarUsuario() {
            let user = document.getElementById('usernameInput').value.trim().toLowerCase();
            let pass = document.getElementById('passwordInput').value.trim();

            if (!user || !pass) {
                alert("Please enter both username and password!");
                return;
            }

            let userRef = rtdb.ref('users/' + user);
            userRef.once('value', async (snapshot) => {
                if (snapshot.exists()) {
                    let data = snapshot.val();
                    if (data.password === pass) {
                        salvarSessao(user);
                    } else {
                        alert("Incorrect password for this username!");
                    }
                } else {
                    // Cria conta nova automaticamente se não existir
                    await userRef.set({ password: pass, createdAt: new Date().toISOString() });
                    salvarSessao(user);
                }
            });
        }

        function salvarSessao(user) {
            localStorage.setItem('oxt_username', user);
            usuarioAtual = user;
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('displayUser').innerText = user;
            carregarHistoricoDoFirebase(user);
        }

        function fazerLogout() {
            localStorage.removeItem('oxt_username');
            location.reload();
        }

        function checarEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviarMensagem();
            }
        }

        async function enviarMensagem() {
            let prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) return;

            document.getElementById('promptInput').value = '';
            adicionarMensagemChat(prompt, 'user');

            // Mensagem de loading da IA
            let loadingId = adicionarMensagemChat("OXT AI is creating your website...", 'ai');

            try {
                let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            {
                                role: "user",
                                parts: [
                                    { text: "System rule: You are OXT AI. Regardless of user input (even random text, math, or chatter), ignore casual text and generate complete valid responsive HTML/CSS/JS website code. Return ONLY clean HTML code." },
                                    { text: `Create website for: ${prompt}` }
                                ]
                            }
                        ]
                    })
                });

                let data = await response.json();
                let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                let htmlLimpo = rawText.replace(/```html/g, '').replace(/```/g, '').trim();

                if (!htmlLimpo || !htmlLimpo.includes('<!DOCTYPE html>')) {
                    htmlLimpo = criarHtmlFallback(prompt);
                }

                let projectId = 'oxt_' + Math.random().toString(36).substr(2, 9);
                
                // Salva no Realtime Database do Firebase na pasta do usuário
                await rtdb.ref(`users_data/${usuarioAtual}/projects/${projectId}`).set({
                    prompt: prompt,
                    html: htmlLimpo,
                    createdAt: new Date().toISOString()
                });

                atualizarMensagemAI(loadingId, prompt, htmlLimpo, projectId);

            } catch (err) {
                console.error(err);
                let htmlLimpo = criarHtmlFallback(prompt);
                let projectId = 'oxt_' + Math.random().toString(36).substr(2, 9);
                
                await rtdb.ref(`users_data/${usuarioAtual}/projects/${projectId}`).set({
                    prompt: prompt,
                    html: htmlLimpo,
                    createdAt: new Date().toISOString()
                });

                atualizarMensagemAI(loadingId, prompt, htmlLimpo, projectId);
            }
        }

        function adicionarMensagemChat(texto, remetente) {
            let chat = document.getElementById('chatContainer');
            let div = document.createElement('div');
            let msgId = 'msg_' + Math.random().toString(36).substr(2, 9);
            div.id = msgId;
            div.className = `message ${remetente}`;
            div.innerText = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return msgId;
        }

        function atualizarMensagemAI(msgId, prompt, html, projectId) {
            let msgEl = document.getElementById(msgId);
            if (!msgEl) return;

            let blob = new Blob([html], { type: 'text/html' });
            let blobUrl = URL.createObjectURL(blob);

            msgEl.innerHTML = `
                Website created successfully for: <strong>${prompt}</strong>
                <div class="code-snippet">${escapeHtml(html)}</div>
                <div class="chat-actions">
                    <a href="${blobUrl}" class="chat-btn chat-btn-success" target="_blank">Open Website</a>
                    <button class="chat-btn" onclick="copiarTexto(this, \`${btoa(encodeURIComponent(html))}\`)">Copy Code</button>
                </div>
            `;
            let chat = document.getElementById('chatContainer');
            chat.scrollTop = chat.scrollHeight;
        }

        function criarHtmlFallback(prompt) {
            return `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXT AI Site</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 40px; border-radius: 16px; max-width: 500px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        h1 { color: #38bdf8; margin-bottom: 15px; font-size: 2rem; }
        p { color: #94a3b8; margin-bottom: 25px; line-height: 1.6; }
        .btn { background: #6366f1; color: white; border: none; padding: 12px 24px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>OXT AI Website</h1>
        <p><strong>Goal:</strong> ${prompt}</p>
        <button class="btn" onclick="alert('Interactive element active!')">Click Me</button>
    </div>
</body>
</html>`;
        }

        function carregarHistoricoDoFirebase(user) {
            rtdb.ref(`users_data/${user}/projects`).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    let projetos = snapshot.val();
                    Object.keys(projetos).forEach(id => {
                        let p = projetos[id];
                        let msgId = adicionarMensagemChat(`Website created for: ${p.prompt}`, 'ai');
                        atualizarMensagemAI(msgId, p.prompt, p.html, id);
                    });
                }
            });
        }

        function copiarFirestoreCode(btn, encodedHtml) {
            let html = decodeURIComponent(atob(encodedHtml));
            navigator.clipboard.writeText(html).then(() => {
                let original = btn.innerText;
                btn.innerText = "Copied! ✓";
                setTimeout(() => { btn.innerText = original; }, 2000);
            });
        }
        
        function copiarTexto(btn, encodedHtml) {
            copiarFirestoreCode(btn, encodedHtml);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
